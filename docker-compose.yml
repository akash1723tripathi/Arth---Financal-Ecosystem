# Local development database only. Production hosting is an OPEN decision (docs/DECISIONS.md).
# Usage: copy .env.example to .env, set POSTGRES_PASSWORD, then `pnpm db:up` (or `docker compose up -d db`).
services:
  db:
    image: postgres:16-alpine
    container_name: arth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-arth}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - arth-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  arth-pgdata:
